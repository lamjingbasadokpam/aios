[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aios"
version = "0.1.0"
description = "Local-first AI Agent Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = []

[project.scripts]
aios = "aios.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
